<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Habit Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <header>
            <h1 class="glow-text">Habit Vault</h1>
            <p class="subtitle">Free, local-first productivity utilities.</p>
            <div class="input-group">
                <input type="text" id="habitInput" placeholder="Enter a new mission...">
                <button onclick="addHabit()">Deploy</button>
            </div>
        </header>

        <div id="habitList" class="habit-grid"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
