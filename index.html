<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Money Tracker HUD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="top-bar">
  <span class="back">← BACK</span>
  <h1>Money Tracker</h1>
  <p class="subtitle">Track income & expenses with HUD-style dashboard</p>
</header>

<section class="cards">
  <div class="card yellow">
    <p class="label">• CORE RESERVE</p>
    <h2 id="balance">₹0</h2>
  </div>

  <div class="card green">
    <p class="label">• ENERGY IN</p>
    <h2 id="income">₹0</h2>
  </div>

  <div class="card red">
    <p class="label">• SYSTEM DRAIN</p>
    <h2 id="expenses">₹0</h2>
  </div>

  <div class="card cyan">
    <p class="label">• SAFE ZONE</p>
    <h2 id="available">₹0</h2>
  </div>
</section>

<section class="actions">
  <button onclick="addIncome()">+ ADD INCOME</button>
  <button class="danger" onclick="addExpense()">− ADD EXPENSE</button>
</section>

<section class="analysis">
  <h3>// MONTHLY ANALYSIS</h3>

  <div class="analysis-grid">
    <canvas id="donut" width="220" height="220"></canvas>

    <div id="expense-list" class="list"></div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
